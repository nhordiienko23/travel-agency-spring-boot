<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">

    <title th:text="#{login.title}">
        Login
    </title>

    <link
            rel="stylesheet"
            href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
</head>

<body class="bg-dark text-white">

<div class="container mt-5" style="max-width: 500px;">

    <!-- LANGUAGE SWITCH -->
    <div class="text-right mb-2">

        <div class="btn-group" role="group">

            <a
                    th:href="@{/auth/sign-in(lang='en')}"
                    class="btn btn-sm btn-outline-light">
                EN
            </a>

            <a
                    th:href="@{/auth/sign-in(lang='ru')}"
                    class="btn btn-sm btn-outline-light">
                RU
            </a>

        </div>

    </div>

    <div class="card bg-secondary shadow-sm p-4 text-white">

        <h2
                class="text-center mb-4"
                th:text="#{login.title}">
            Login
        </h2>

        <!-- LOGIN ERROR -->
        <div
                th:if="${param.error}"
                class="alert alert-danger text-center"
                th:text="#{login.error}">
            Invalid username or password
        </div>

        <!-- BLOCKED -->
        <div
                th:if="${param.blocked}"
                class="alert alert-danger text-center"
                th:text="#{login.blocked}">
            Your account has been blocked by an administrator!
        </div>

        <!-- REGISTRATION SUCCESS -->
        <div
                th:if="${param.registered}"
                class="alert alert-success text-center"
                th:text="#{login.registered}">
            Registration successful! Please sign in.
        </div>

        <!-- LOGIN FORM -->
        <form
                th:action="@{/auth/sign-in}"
                method="post">

            <div class="form-group">

                <label
                        for="username"
                        th:text="#{login.username}">
                    Username
                </label>

                <input
                        type="text"
                        class="form-control bg-dark text-white border-secondary"
                        id="username"
                        name="username"
                        required>

            </div>

            <div class="form-group mt-3">

                <label
                        for="password"
                        th:text="#{login.password}">
                    Password
                </label>

                <input
                        type="password"
                        class="form-control bg-dark text-white border-secondary"
                        id="password"
                        name="password"
                        required>

            </div>

            <button
                    type="submit"
                    class="btn btn-success w-100 mt-4"
                    th:text="#{login.submit}">
                Sign in
            </button>

        </form>

        <div class="mt-4 text-center">

            <p>

                <span th:text="#{login.noAccount}">
                    Don't have an account?
                </span>

                <a
                        th:href="@{/auth/sign-up}"
                        class="text-info"
                        th:text="#{nav.signup}">
                    Sign up
                </a>

            </p>

            <a
                    th:href="@{/}"
                    class="text-muted"
                    th:text="#{nav.home}">
                Back to Home
            </a>

        </div>

    </div>

</div>

</body>
</html>
