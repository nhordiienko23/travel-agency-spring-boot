<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{index.title}">Travel Agency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dark-theme.css}">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 justify-content-between">
    <a class="navbar-brand" href="#" th:text="#{index.brand}">Travel Agency</a>
    <div class="form-inline d-flex align-items-center">
        <!-- Переключатель языков -->
        <div class="btn-group me-3" role="group">
            <a th:href="@{/(lang='en')}" class="btn btn-sm btn-outline-light">EN</a>
            <a th:href="@{/(lang='ru')}" class="btn btn-sm btn-outline-light">RU</a>
        </div>
        <a th:href="@{/auth/sign-in}" class="btn btn-outline-success me-2" th:text="#{nav.signin}">Sign in</a>
        <a th:href="@{/auth/sign-up}" class="btn btn-outline-info" th:text="#{nav.signup}">Sign up</a>
    </div>
</nav>

<div class="container mt-5 text-center">
    <h1 class="display-4" th:text="#{index.welcome}">Welcome to Travel Agency!</h1>
    <p class="lead mt-3">
        <span th:text="#{index.prompt1}">Please</span>
        <a th:href="@{/auth/sign-in}" th:text="#{nav.signin}">sign in</a>
        <span th:text="#{index.prompt2}">or</span>
        <a th:href="@{/auth/sign-up}" th:text="#{nav.signup}">sign up</a>
        <span th:text="#{index.prompt3}">to order your dream tour.</span>
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
