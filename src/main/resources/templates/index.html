
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">

<head>
    <meta charset="UTF-8">

    <title th:text="#{index.brand}">
        Travel Agency
    </title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          th:href="@{/css/dark-theme.css}">
</head>

<body class="bg-dark text-white">

<div class="container-fluid p-3 text-end">
    <div class="btn-group" role="group">

        <a th:href="@{/(lang='en')}"
           class="btn btn-sm btn-outline-light">
            EN
        </a>

        <a th:href="@{/(lang='ru')}"
           class="btn btn-sm btn-outline-light">
            RU
        </a>

    </div>
</div>

<div class="d-flex flex-column justify-content-center align-items-center"
     style="height: 85vh;">

    <div class="text-center">

        <h1 class="display-3 mb-4 fw-bold text-info"
            th:text="#{index.brand}">
            Travel Agency
        </h1>

        <p class="lead mb-5"
           th:text="#{index.welcome}">
            Welcome to Travel Agency
        </p>

        <div>

            <a th:href="@{/auth/sign-in}"
               class="btn btn-primary btn-lg me-3 px-5"
               th:text="#{index.signInBtn}">
                Sign In
            </a>

            <a th:href="@{/auth/sign-up}"
               class="btn btn-outline-light btn-lg px-5"
               th:text="#{index.signUpBtn}">
                Sign Up
            </a>

        </div>

    </div>

</div>

</body>
</html>
