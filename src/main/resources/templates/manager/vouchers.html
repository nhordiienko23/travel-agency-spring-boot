
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">

<head>
    <meta charset="utf-8">

    <title th:text="#{manager.title}">
        Manager - Tour Management
    </title>

    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
            rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/css/sb-admin-2.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            th:href="@{/css/dark-theme.css}">
</head>

<body id="page-top">

<div id="wrapper">


    <!-- ========================================================= -->
    <!-- SIDEBAR -->
    <!-- ========================================================= -->

    <ul
            class="navbar-nav bg-gradient-success sidebar sidebar-dark accordion"
            id="accordionSidebar">

        <!-- BRAND -->

        <a
                class="sidebar-brand d-flex align-items-center justify-content-center"
                th:href="@{/dashboard(lang=${#locale.language})}">

            <div class="sidebar-brand-text mx-3"
                 th:text="#{index.brand}">

                Travel Manager

            </div>

        </a>


        <hr class="sidebar-divider my-0">


        <!-- MANAGER PANEL -->

        <li class="nav-item active">

            <a
                    class="nav-link"
                    th:href="@{/manager/vouchers(lang=${#locale.language})}">

                <i class="fas fa-fw fa-plane"></i>

                <span th:text="#{manager.nav.manage}">
                    Manage Tours
                </span>

            </a>

        </li>


        <!-- DASHBOARD -->

        <li class="nav-item">

            <a
                    class="nav-link"
                    th:href="@{/dashboard(lang=${#locale.language})}">

                <i class="fas fa-fw fa-tachometer-alt"></i>

                <span th:text="#{dashboard.title}">
                    Dashboard
                </span>

            </a>

        </li>


        <hr class="sidebar-divider">

    </ul>


    <!-- ========================================================= -->
    <!-- CONTENT WRAPPER -->
    <!-- ========================================================= -->

    <div
            id="content-wrapper"
            class="d-flex flex-column">

        <div id="content">


            <!-- ================================================= -->
            <!-- TOPBAR -->
            <!-- ================================================= -->

            <nav
                    class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">

                <ul
                        class="navbar-nav ml-auto align-items-center">


                    <!-- LANGUAGE SWITCH -->

                    <li class="nav-item mr-3">

                        <div
                                class="btn-group"
                                role="group">

                            <!-- EN -->

                            <a
                                    th:href="@{/manager/vouchers(
                                        lang='en',
                                        page=${currentPage},
                                        keyword=${searchRequest.keyword},
                                        tourType=${searchRequest.tourType},
                                        transferType=${searchRequest.transferType},
                                        hotelType=${searchRequest.hotelType},
                                        maxPrice=${searchRequest.maxPrice},
                                        isHot=${searchRequest.isHot},
                                        status=${searchRequest.status},
                                        dateFrom=${searchRequest.dateFrom},
                                        dateTo=${searchRequest.dateTo},
                                        sortField=${sortField},
                                        sortDir=${sortDir}
                                    )}"
                                    class="btn btn-sm btn-outline-secondary">

                                EN

                            </a>


                            <!-- RU -->

                            <a
                                    th:href="@{/manager/vouchers(
                                        lang='ru',
                                        page=${currentPage},
                                        keyword=${searchRequest.keyword},
                                        tourType=${searchRequest.tourType},
                                        transferType=${searchRequest.transferType},
                                        hotelType=${searchRequest.hotelType},
                                        maxPrice=${searchRequest.maxPrice},
                                        isHot=${searchRequest.isHot},
                                        status=${searchRequest.status},
                                        dateFrom=${searchRequest.dateFrom},
                                        dateTo=${searchRequest.dateTo},
                                        sortField=${sortField},
                                        sortDir=${sortDir}
                                    )}"
                                    class="btn btn-sm btn-outline-secondary">

                                RU

                            </a>

                        </div>

                    </li>


                    <!-- SEPARATOR -->

                    <div
                            class="topbar-divider d-none d-sm-block">
                    </div>


                    <!-- LOGOUT -->

                    <li class="nav-item">

                        <a
                                class="nav-link text-danger font-weight-bold"
                                th:href="@{/auth/logout}">

                            <i
                                    class="fas fa-sign-out-alt fa-sm fa-fw mr-2">
                            </i>

                            <span th:text="#{dashboard.logout}">
                                Logout
                            </span>

                        </a>

                    </li>

                </ul>

            </nav>


            <!-- ================================================= -->
            <!-- MAIN -->
            <!-- ================================================= -->

            <div class="container-fluid mt-4">


                <!-- FLASH SUCCESS -->

                <div
                        th:if="${successMessage}"
                        class="alert alert-success text-center scroll-target"
                        th:text="${successMessage}">
                </div>


                <!-- FLASH ERROR -->

                <div
                        th:if="${errorMessage}"
                        class="alert alert-danger text-center scroll-target"
                        th:text="${errorMessage}">
                </div>


                <!-- TITLE -->

                <h1
                        class="h3 mb-4 text-gray-800"
                        th:text="#{manager.heading}">

                    Manager Panel: Hot Tours & Statuses

                </h1>


                <!-- ================================================= -->
                <!-- SEARCH -->
                <!-- ================================================= -->

                <div class="card shadow mb-4">

                    <div class="card-body">

                        <form
                                th:action="@{/manager/vouchers}"
                                method="get"
                                th:object="${searchRequest}"
                                class="form-row align-items-end">


                            <!-- KEEP CURRENT LANGUAGE -->

                            <input
                                    type="hidden"
                                    name="lang"
                                    th:value="${#locale.language}">


                            <!-- KEYWORD -->

                            <div class="col-md-3 mb-2">

                                <label
                                        class="small text-muted mb-0"
                                        th:text="#{search.keyword}">

                                    Search

                                </label>

                                <input
                                        type="text"
                                        th:field="*{keyword}"
                                        class="form-control form-control-sm"
                                        th:placeholder="#{search.keyword}">

                            </div>


                            <!-- TOUR TYPE -->

                            <div class="col-md-2 mb-2">

                                <label
                                        class="small text-muted mb-0"
                                        th:text="#{search.tourType}">

                                    Tour Type

                                </label>

                                <select
                                        th:field="*{tourType}"
                                        class="form-control form-control-sm">

                                    <option
                                            value=""
                                            th:text="#{search.all}">

                                        All Types

                                    </option>

                                    <option
                                            th:each="type : ${T(com.epam.finaltask.voucher.TourType).values()}"
                                            th:value="${type}"
                                            th:text="${type}">
                                    </option>

                                </select>

                            </div>


                            <!-- TRANSFER -->

                            <div class="col-md-2 mb-2">

                                <label
                                        class="small text-muted mb-0"
                                        th:text="#{search.transfer}">

                                    Transfer

                                </label>

                                <select
                                        th:field="*{transferType}"
                                        class="form-control form-control-sm">

                                    <option
                                            value=""
                                            th:text="#{search.all}">

                                        All Transfers

                                    </option>

                                    <option
                                            th:each="type : ${T(com.epam.finaltask.voucher.TransferType).values()}"
                                            th:value="${type}"
                                            th:text="${type}">
                                    </option>

                                </select>

                            </div>


                            <!-- HOTEL -->

                            <div class="col-md-2 mb-2">

                                <label
                                        class="small text-muted mb-0"
                                        th:text="#{search.hotel}">

                                    Hotel

                                </label>

                                <select
                                        th:field="*{hotelType}"
                                        class="form-control form-control-sm">

                                    <option
                                            value=""
                                            th:text="#{search.all}">

                                        All Hotels

                                    </option>

                                    <option
                                            th:each="type : ${T(com.epam.finaltask.voucher.HotelType).values()}"
                                            th:value="${type}"
                                            th:text="${type}">
                                    </option>

                                </select>

                            </div>


                            <!-- MAX PRICE -->

                            <div class="col-md-3 mb-2">

                                <label
                                        class="small text-muted mb-0"
                                        th:text="#{dashboard.maxPrice}">

                                    Max Price ($)

                                </label>

                                <input
                                        type="number"
                                        step="0.01"
                                        th:field="*{maxPrice}"
                                        class="form-control form-control-sm"
                                        th:placeholder="#{dashboard.maxPrice}">

                            </div>


                            <!-- FROM DATE -->

                            <div class="col-md-2 mb-2">

                                <label
                                        class="small text-muted mb-0"
                                        th:text="#{search.fromDate}">

                                    From Date

                                </label>

                                <input
                                        type="date"
                                        th:field="*{dateFrom}"
                                        class="form-control form-control-sm">

                            </div>


                            <!-- TO DATE -->

                            <div class="col-md-2 mb-2">

                                <label
                                        class="small text-muted mb-0"
                                        th:text="#{search.toDate}">

                                    To Date

                                </label>

                                <input
                                        type="date"
                                        th:field="*{dateTo}"
                                        class="form-control form-control-sm">

                            </div>


                            <!-- HOT / REGULAR -->

                            <div class="col-md-2 mb-2">

                                <label
                                        class="small text-muted mb-0"
                                        th:text="#{search.hotRegular}">

                                    Hot / Regular

                                </label>

                                <select
                                        th:field="*{isHot}"
                                        class="form-control form-control-sm">

                                    <option
                                            value=""
                                            th:text="#{search.all}">
                                        All
                                    </option>

                                    <option
                                            value="true"
                                            th:text="#{search.hotOnly}">
                                        HOT Only
                                    </option>

                                    <option
                                            value="false"
                                            th:text="#{search.regularOnly}">
                                        Regular Only
                                    </option>

                                </select>

                            </div>


                            <!-- STATUS -->

                            <div class="col-md-2 mb-2">

                                <label
                                        class="small text-muted mb-0"
                                        th:text="#{search.status}">

                                    Status

                                </label>

                                <select
                                        th:field="*{status}"
                                        class="form-control form-control-sm">

                                    <option
                                            value=""
                                            th:text="#{manager.allStatuses}">

                                        All Statuses

                                    </option>

                                    <option value="REGISTERED">
                                        REGISTERED
                                    </option>

                                    <option value="PAID">
                                        PAID
                                    </option>

                                    <option value="CANCELED">
                                        CANCELED
                                    </option>

                                </select>

                            </div>


                            <!-- SORT FIELD -->

                            <div class="col-md-2 mb-2">

                                <label
                                        class="small text-muted mb-0"
                                        th:text="#{search.sortBy}">

                                    Sort By

                                </label>

                                <select
                                        name="sortField"
                                        class="form-control form-control-sm">

                                    <option
                                            value="arrivalDate"
                                            th:selected="${sortField == 'arrivalDate'}">

                                        Date

                                    </option>

                                    <option
                                            value="price"
                                            th:selected="${sortField == 'price'}">

                                        Price

                                    </option>

                                    <option
                                            value="title"
                                            th:selected="${sortField == 'title'}">

                                        Title

                                    </option>

                                    <option
                                            value="isHot"
                                            th:selected="${sortField == 'isHot'}">

                                        Hot

                                    </option>

                                    <option
                                            value="status"
                                            th:selected="${sortField == 'status'}">

                                        Status

                                    </option>

                                </select>

                            </div>


                            <!-- SORT DIRECTION -->

                            <div class="col-md-2 mb-2">

                                <label
                                        class="small text-muted mb-0"
                                        th:text="#{search.direction}">

                                    Direction

                                </label>

                                <select
                                        name="sortDir"
                                        class="form-control form-control-sm">

                                    <option
                                            value="desc"
                                            th:selected="${sortDir == 'desc'}"
                                            th:text="#{dashboard.desc}">

                                        Descending

                                    </option>

                                    <option
                                            value="asc"
                                            th:selected="${sortDir == 'asc'}"
                                            th:text="#{dashboard.asc}">

                                        Ascending

                                    </option>

                                </select>

                            </div>


                            <!-- BUTTONS -->

                            <div
                                    class="col-md-12 mb-2 text-right mt-3">

                                <button
                                        type="submit"
                                        class="btn btn-primary btn-sm px-4"
                                        th:text="#{search.btnSearch}">

                                    Search

                                </button>


                                <a
                                        th:href="@{/manager/vouchers(
                                            lang=${#locale.language}
                                        )}"
                                        class="btn btn-secondary btn-sm px-4 ml-1"
                                        th:text="#{search.btnClear}">

                                    Clear

                                </a>

                            </div>

                        </form>

                    </div>

                </div>


                <!-- ================================================= -->
                <!-- VOUCHERS TABLE -->
                <!-- ================================================= -->

                <div class="card shadow mb-4">

                    <div class="card-body">

                        <table
                                class="table table-bordered"
                                style="table-layout: fixed; width: 100%; word-wrap: break-word;">

                            <thead class="thead-dark">

                            <tr>

                                <th
                                        style="width: 25%;"
                                        th:text="#{dashboard.titleCol}">

                                    Title

                                </th>

                                <th
                                        style="width: 15%;"
                                        th:text="#{dashboard.datesCol}">

                                    Dates

                                </th>

                                <th
                                        style="width: 10%;"
                                        th:text="#{dashboard.priceCol}">

                                    Price

                                </th>

                                <th
                                        style="width: 15%;"
                                        th:text="#{manager.table.hotStatus}">

                                    Hot Status

                                </th>

                                <th
                                        style="width: 15%;"
                                        th:text="#{dashboard.statusCol}">

                                    Tour Status

                                </th>

                                <th
                                        style="width: 20%;"
                                        class="text-center"
                                        th:text="#{manager.table.actions}">

                                    Actions

                                </th>

                            </tr>

                            </thead>


                            <tbody>


                            <!-- EMPTY -->

                            <tr
                                    th:if="${#lists.isEmpty(vouchersPage.content)}">

                                <td
                                        colspan="6"
                                        class="text-center"
                                        th:text="#{dashboard.noTours}">

                                    No tours available.

                                </td>

                            </tr>


                            <!-- VOUCHERS -->

                            <tr
                                    th:each="v : ${vouchersPage.content}">


                                <!-- TITLE -->

                                <td
                                        class="align-middle"
                                        style="word-break: break-all;"
                                        th:text="${v.title}">
                                </td>


                                <!-- DATES -->

                                <td
                                        class="small align-middle text-nowrap">

                                    <span
                                            th:text="${v.arrivalDate}">
                                    </span>

                                    <br>

                                    <span
                                            th:text="${v.evictionDate}">
                                    </span>

                                </td>


                                <!-- PRICE -->

                                <td class="align-middle">

                                    $

                                    <span
                                            th:text="${v.price != null
                                            ? #numbers.formatDecimal(
                                                v.price,
                                                1,
                                                'NONE',
                                                2,
                                                'POINT'
                                              )
                                            : '0.00'}">
                                    </span>

                                </td>


                                <!-- HOT STATUS -->

                                <td class="align-middle">

                                    <span
                                            th:if="${v.isHot}"
                                            class="badge badge-danger"
                                            th:text="#{manager.hot}">

                                        HOT 🔥

                                    </span>

                                    <span
                                            th:unless="${v.isHot}"
                                            class="badge badge-secondary"
                                            th:text="#{manager.regular}">

                                        Regular

                                    </span>

                                </td>


                                <!-- TOUR STATUS -->

                                <td class="align-middle">

                                    <span
                                            class="badge badge-info"
                                            th:text="${v.status}">

                                        REGISTERED

                                    </span>

                                </td>


                                <!-- ACTIONS -->

                                <td
                                        class="align-middle text-center">


                                    <!-- TOGGLE HOT -->

                                    <form
                                            th:action="@{/manager/vouchers/toggle-hot}"
                                            method="post"
                                            class="d-inline">

                                        <input
                                                type="hidden"
                                                name="id"
                                                th:value="${v.id}">

                                        <input
                                                type="hidden"
                                                name="isHot"
                                                th:value="${v.isHot}">


                                        <button
                                                type="submit"
                                                class="btn btn-sm mb-1"

                                                th:classappend="${v.isHot}
                                                    ? 'btn-secondary'
                                                    : 'btn-warning'"

                                                th:text="${v.isHot}
                                                    ? #{manager.btn.removeHot}
                                                    : #{manager.btn.setHot}">

                                            Set as Hot

                                        </button>

                                    </form>


                                    <!-- CHANGE STATUS -->

                                    <form
                                            th:action="@{/manager/vouchers/update-status}"
                                            method="post"
                                            class="d-inline ml-2">

                                        <input
                                                type="hidden"
                                                name="id"
                                                th:value="${v.id}">


                                        <select
                                                name="status"
                                                class="form-control form-control-sm d-inline w-auto"

                                                onchange="this.form.submit()">

                                            <option
                                                    value=""
                                                    disabled
                                                    selected
                                                    th:text="#{manager.select.status}">

                                                Change Status...

                                            </option>

                                            <option value="PAID">
                                                PAID
                                            </option>

                                            <option value="CANCELED">
                                                CANCELED
                                            </option>

                                            <option value="REGISTERED">
                                                REGISTERED
                                            </option>

                                        </select>

                                    </form>

                                </td>

                            </tr>

                            </tbody>

                        </table>


                        <!-- ================================================= -->
                        <!-- PAGINATION -->
                        <!-- ================================================= -->

                        <nav
                                th:if="${vouchersPage.totalPages > 1}"
                                class="mt-4">

                            <ul
                                    class="pagination justify-content-center">


                                <!-- PREVIOUS -->

                                <li
                                        class="page-item"
                                        th:classappend="${currentPage == 0}
                                            ? 'disabled'">

                                    <a
                                            class="page-link"

                                            th:href="@{/manager/vouchers(
                                                page=${currentPage - 1},
                                                lang=${#locale.language},
                                                keyword=${searchRequest.keyword},
                                                tourType=${searchRequest.tourType},
                                                transferType=${searchRequest.transferType},
                                                hotelType=${searchRequest.hotelType},
                                                maxPrice=${searchRequest.maxPrice},
                                                isHot=${searchRequest.isHot},
                                                status=${searchRequest.status},
                                                dateFrom=${searchRequest.dateFrom},
                                                dateTo=${searchRequest.dateTo},
                                                sortField=${sortField},
                                                sortDir=${sortDir}
                                            )}"

                                            th:text="#{nav.previous}">

                                        Previous

                                    </a>

                                </li>


                                <!-- PAGE NUMBERS -->

                                <li
                                        class="page-item"
                                        th:each="i : ${#numbers.sequence(
                                            0,
                                            vouchersPage.totalPages - 1
                                        )}"

                                        th:classappend="${currentPage == i}
                                            ? 'active'">

                                    <a
                                            class="page-link"

                                            th:href="@{/manager/vouchers(
                                                page=${i},
                                                lang=${#locale.language},
                                                keyword=${searchRequest.keyword},
                                                tourType=${searchRequest.tourType},
                                                transferType=${searchRequest.transferType},
                                                hotelType=${searchRequest.hotelType},
                                                maxPrice=${searchRequest.maxPrice},
                                                isHot=${searchRequest.isHot},
                                                status=${searchRequest.status},
                                                dateFrom=${searchRequest.dateFrom},
                                                dateTo=${searchRequest.dateTo},
                                                sortField=${sortField},
                                                sortDir=${sortDir}
                                            )}"

                                            th:text="${i + 1}">

                                        1

                                    </a>

                                </li>


                                <!-- NEXT -->

                                <li
                                        class="page-item"
                                        th:classappend="${currentPage
                                            == vouchersPage.totalPages - 1}
                                            ? 'disabled'">

                                    <a
                                            class="page-link"

                                            th:href="@{/manager/vouchers(
                                                page=${currentPage + 1},
                                                lang=${#locale.language},
                                                keyword=${searchRequest.keyword},
                                                tourType=${searchRequest.tourType},
                                                transferType=${searchRequest.transferType},
                                                hotelType=${searchRequest.hotelType},
                                                maxPrice=${searchRequest.maxPrice},
                                                isHot=${searchRequest.isHot},
                                                status=${searchRequest.status},
                                                dateFrom=${searchRequest.dateFrom},
                                                dateTo=${searchRequest.dateTo},
                                                sortField=${sortField},
                                                sortDir=${sortDir}
                                            )}"

                                            th:text="#{nav.next}">

                                        Next

                                    </a>

                                </li>

                            </ul>

                        </nav>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
